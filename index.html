<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>れきしクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 色やサイズの基本設定 ===== */
:root{
  --bg:#eef3dc; --card:#ffffff; --ink:#3b3b3b; --sub:#7a7a7a;
  --green:#5cbf2a; --green-d:#46a01b; --red:#ff5a5a; --red-d:#d93e3e;
  --blue:#3fa9f5; --gold:#ffc83d; --line:#e2e6d0; --cream:#fffbea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  font-weight:700; -webkit-user-select:none; user-select:none;
  min-height:100vh; overflow-x:hidden;
}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none}
ruby rt{font-size:.5em;font-weight:700;color:#888}
.screen{display:none;max-width:760px;margin:0 auto;padding:16px 16px 120px}
.screen.active{display:block}

/* ===== ぷにっと押せるボタン ===== */
.btn{
  --b1:#86e255; --b2:#4fb51f; --b3:#3a8c12;   /* 上の色・下の色・影の色 */
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 22px;border-radius:22px;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);
  background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:0 7px 0 var(--b3), 0 12px 16px rgba(40,60,10,.22);
  transition:transform .08s, box-shadow .08s;
}
/* 上半分のつやつやした光 */
.btn::before{content:"";position:absolute;left:12px;right:12px;top:5px;height:42%;border-radius:16px;
  background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.05));pointer-events:none}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--b3), 0 3px 5px rgba(40,60,10,.25)}
.btn.blue{--b1:#74c8ff;--b2:#2f9be8;--b3:#1d6fae}
.btn.red{--b1:#ff8a8a;--b2:#f04c4c;--b3:#b83131}
.btn.gold{--b1:#ffe27a;--b2:#ffbf1f;--b3:#c98b00;color:#6b4300;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.gray{--b1:#ffffff;--b2:#eef1e2;--b3:#c6cbb3;color:var(--ink);text-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.btn.wide{width:100%}
/* はなした時の「ぷるん」 */
.jelly{animation:jelly .38s ease !important}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.07,.92)}60%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
/* キラッと光が走る（ガチャが回せる時など） */
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:rgba(255,255,255,.6);transform:skewX(-20deg);animation:shine 2.2s infinite}
@keyframes shine{0%{left:-60px}60%,100%{left:110%}}

/* ===== 上のバー（スコア表示） ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.logo{font-size:24px;font-weight:800;color:var(--green-d);letter-spacing:1px}
.stats{display:flex;gap:8px;align-items:center}
.stat{background:#fff;border-radius:14px;padding:6px 12px;font-size:17px;box-shadow:0 3px 0 #d8ddc4}
.icon-btn{background:#fff;border-radius:14px;width:42px;height:42px;font-size:20px;box-shadow:0 3px 0 #d8ddc4}

/* ===== 先生（みるく先生） ===== */
.teacher-row{display:flex;align-items:flex-end;gap:10px;margin:8px 0 18px}
.teacher{flex:0 0 auto;width:130px}
.teacher.sm{width:96px}
.mochi{width:100%;height:auto;display:block;transform-origin:50% 95%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.teacher.t-jump .mochi{animation:jump .7s ease}
@keyframes jump{0%{transform:none}18%{transform:scale(1.12,.84)}50%{transform:translateY(-30px) scale(.94,1.08)}78%{transform:scale(1.1,.9)}100%{transform:none}}
.teacher.t-shake .mochi{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(8px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.mochi .eyes-happy,.mochi .eyes-sad,.mochi .tear{display:none}
.t-happy .mochi .eyes-normal,.t-sad .mochi .eyes-normal{display:none}
.t-happy .mochi .eyes-happy{display:inline}
.t-sad .mochi .eyes-sad,.t-sad .mochi .tear{display:inline}
.mochi .blush{opacity:.35;transition:opacity .3s}
.t-happy .mochi .blush{opacity:.9}

.bubble{
  position:relative;background:#fff;border-radius:20px;padding:14px 16px;
  font-size:19px;line-height:1.6;box-shadow:0 4px 0 #d8ddc4;flex:1;
}
.bubble::before{
  content:"";position:absolute;left:-12px;bottom:26px;border:8px solid transparent;
  border-right:14px solid #fff;
}
.tname{font-size:13px;color:var(--green-d);margin-bottom:2px}

/* ===== 章とステージの道 ===== */
.chapter{background:#fff;border-radius:24px;margin:0 0 22px;overflow:hidden;box-shadow:0 5px 0 #d8ddc4}
.ch-head{background:var(--c);color:#fff;padding:14px 18px}
.ch-num{font-size:15px;opacity:.95}
.ch-title{font-size:23px;font-weight:800}
.ch-era{font-size:14px;opacity:.95}
.path{padding:22px 0 10px;display:flex;flex-direction:column;align-items:center}
.node-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:34px}
.node{
  width:84px;height:84px;border-radius:50%;font-size:34px;color:#fff;
  background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.18);position:relative;
}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node.locked{background:#d9dccb;color:#9aa08a;box-shadow:0 7px 0 #bfc3ae}
.node.boss{width:100px;height:100px;font-size:42px}
.node.next{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node-label{font-size:14px;margin-top:8px;color:var(--ink);text-align:center;max-width:140px}
.node-stars{font-size:15px;letter-spacing:1px;height:18px;color:var(--gold);text-shadow:0 1px 0 #c79500}
.start-tag{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#fff;color:var(--c);border:2px solid var(--c);border-radius:12px;padding:2px 10px;font-size:14px;
  animation:bob 1s ease-in-out infinite alternate;
}
@keyframes bob{to{transform:translate(-50%,-5px)}}

/* ===== ポップアップ ===== */
.modal{position:fixed;inset:0;background:rgba(40,50,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{
  background:var(--cream);width:100%;max-width:760px;border-radius:28px 28px 0 0;padding:20px 18px 32px;
  animation:up .25s ease;max-height:92vh;overflow:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{margin:0 0 4px;font-size:24px}
.sheet .subt{color:var(--sub);font-size:15px;margin-bottom:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.mode{
  background:#fff;border-radius:20px;padding:16px 10px;text-align:center;font-size:20px;color:var(--ink);
  border:3px solid #e6e9d6;box-shadow:0 5px 0 #d8ddc4;
}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 #d8ddc4}
.mode .mi{font-size:44px;display:block}
.mode .ms{color:var(--gold);font-size:18px;text-shadow:0 1px 0 #c79500}
.mode .md{font-size:13px;color:var(--sub);font-weight:500;display:block;margin-top:4px}
.mode:disabled{opacity:.4}
.setting{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;font-size:18px}
.switch{width:62px;height:34px;border-radius:20px;background:#ccc;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{left:31px}

/* ===== クイズ画面 ===== */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.quit{background:none;font-size:30px;color:#a9ae98;width:40px}
.bar{flex:1;height:20px;background:#dfe4cb;border-radius:12px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(#7ad94a,var(--green));border-radius:12px;transition:width .4s}
.hearts{font-size:22px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.35}
.combo{text-align:center;height:26px;font-size:18px;color:#ff8a00}
.q-tag{font-size:13px;color:#ff8a00}
.q-text{font-size:22px;line-height:1.8}
.read-btn{background:#eef7e6;border-radius:12px;padding:4px 10px;font-size:15px;color:var(--green-d);margin-top:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.choice{
  background:#fff;border:3px solid #e1e5d0;border-radius:20px;padding:18px 10px;font-size:21px;color:var(--ink);
  box-shadow:0 5px 0 #d4d9c0;min-height:84px;line-height:1.35;
}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 #d4d9c0}
.choice.ok{background:#d9f7c8;border-color:var(--green);box-shadow:0 5px 0 var(--green-d)}
.choice.ng{background:#ffe0e0;border-color:var(--red);box-shadow:0 5px 0 var(--red-d)}
.hint-line{font-size:15px;color:var(--sub);margin:4px 2px 8px}
.boxes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.boxes span{width:30px;height:30px;border:2px dashed #c5cbb0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--green-d);background:#fff}
.ans-input{
  width:100%;font-size:28px;padding:16px;border-radius:18px;border:3px solid #dfe3cf;font-family:inherit;font-weight:700;
  -webkit-user-select:text;user-select:text;outline:none;background:#fff;
}
.ans-input:focus{border-color:var(--blue)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1}
.mic{
  width:130px;height:130px;border-radius:50%;font-size:56px;background:var(--blue);color:#fff;
  box-shadow:0 8px 0 #2a86c9;display:block;margin:10px auto;
}
.mic.listening{background:var(--red);box-shadow:0 8px 0 var(--red-d);animation:pulse .9s infinite}
.heard{text-align:center;font-size:24px;min-height:40px;margin:6px 0}
.small-note{text-align:center;color:var(--sub);font-size:15px}
.canvas-wrap{background:#fff;border-radius:20px;border:3px solid #dfe3cf;overflow:hidden;touch-action:none}
canvas.pad{display:block;width:100%;height:230px;touch-action:none}

/* 正解・不正解のおしらせ */
.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px 18px 26px;transform:translateY(110%);transition:transform .25s ease;
}
.feedback.show{transform:none}
.feedback .inner{max-width:760px;margin:0 auto}
.feedback.good{background:#d7f5c2;color:#2f7a0c}
.feedback.bad{background:#ffdede;color:#b83030}
.fb-title{font-size:26px;font-weight:800}
.fb-ans{font-size:20px;margin:4px 0;color:var(--ink)}
.fb-exp{font-size:16px;color:#555;font-weight:500;line-height:1.6;margin-bottom:12px}
.xp-pop{position:fixed;font-size:26px;color:#ff9f00;font-weight:800;pointer-events:none;z-index:60;animation:xpup 1s ease forwards;text-shadow:0 2px 0 #fff}
@keyframes xpup{to{transform:translateY(-70px);opacity:0}}

/* ===== 結果画面 ===== */
.result{text-align:center;padding-top:20px}
.result h1{font-size:34px;margin:8px 0;color:var(--green-d)}
.result.fail h1{color:var(--red-d)}
.big-stars{font-size:64px;letter-spacing:6px;margin:6px 0}
.big-stars span{display:inline-block;filter:grayscale(1);opacity:.3;transition:.3s}
.big-stars span.got{filter:none;opacity:1;animation:starpop .45s ease}
@keyframes starpop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.res-cards{display:flex;gap:12px;justify-content:center;margin:16px 0}
.res-card{background:#fff;border-radius:18px;padding:12px 18px;min-width:120px;box-shadow:0 4px 0 #d8ddc4}
.res-card b{display:block;font-size:28px}
.missed{background:#fff;border-radius:18px;padding:12px 16px;text-align:left;margin:14px 0;box-shadow:0 4px 0 #d8ddc4}
.missed h3{margin:0 0 6px;font-size:18px}
.missed li{font-size:17px;margin:6px 0;font-weight:500}
.missed li b{color:var(--red-d)}

.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:99;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* ===== 立体的な選択肢・カード・ステージ ===== */
.choice,.mode{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#f2f5e8);
  box-shadow:0 7px 0 #cdd3b8,0 12px 14px rgba(40,60,10,.12)}
.choice::before,.mode::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:38%;border-radius:14px;
  background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.choice:active,.mode:active{transform:translateY(6px);box-shadow:0 1px 0 #cdd3b8}
.node{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 42%),var(--c);
  box-shadow:0 8px 0 rgba(0,0,0,.22),0 14px 16px rgba(0,0,0,.15),inset 0 -6px 0 rgba(0,0,0,.12)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
/* おぼえた度のリング */
.ring{width:102px;height:102px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#ffc83d calc(var(--p)*1%),#e9ecdb 0)}
.ring.boss{width:120px;height:120px}
.node-sub{font-size:12px;color:var(--sub)}

/* ===== ホームのガチャ・復習カード ===== */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
.hub-card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #d8ddc4;display:flex;flex-direction:column;gap:8px}
.hub-title{font-size:18px}
.hub-sub{font-size:13px;color:var(--sub)}
.hub-btns{display:flex;gap:8px}
.hub-card .btn{flex:1;font-size:17px;padding:12px 8px}
.gauge{display:flex;gap:6px}
.gauge span{flex:1;height:22px;border-radius:11px;background:#e6e9d6;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.gauge span.on{background:linear-gradient(#ffe27a,#ffb703);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.gauge span.pop{animation:starpop .5s ease}
.gauge.full span{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.3)}}
.gauge.big span{height:30px;border-radius:15px}
.mastered-badge{display:inline-block;background:#fff3c4;color:#a06a00;border-radius:12px;padding:4px 12px;font-size:17px;margin:4px 0}
.m-meter{font-size:15px;color:#666;margin:2px 0 6px}
.m-meter b{color:#ffb703;letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{background:#fff3c4;border-radius:12px;padding:4px 10px;font-size:15px}
.res-box{background:#fff;border-radius:18px;padding:12px 16px;margin:14px 0;box-shadow:0 4px 0 #d8ddc4}

/* ===== ガチャガチャ ===== */
.g-title{flex:1;text-align:center;font-size:22px}
.gacha-stage{position:relative;height:470px;display:flex;justify-content:center;margin-top:6px}
.machine{position:relative;width:250px;transition:opacity .3s}
.machine.dim{opacity:.12}
.machine.shake{animation:mshake .25s ease 4}
@keyframes mshake{0%,100%{transform:none}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.dome{position:relative;width:230px;height:230px;margin:0 auto -26px;border-radius:50%;overflow:hidden;z-index:1;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(255,255,255,.3) 28%,rgba(200,235,255,.45) 72%);
  border:8px solid #fff;box-shadow:inset 0 -10px 20px rgba(0,0,0,.08),0 6px 0 #d6dcc4}
.cap-mini{position:absolute;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,var(--cc) 50%,#fff 50%);border:3px solid rgba(0,0,0,.08)}
.machine.shake .cap-mini{animation:jiggle .12s infinite alternate}
@keyframes jiggle{to{transform:translate(4px,-7px) rotate(25deg)}}
.mbody{position:relative;z-index:2;height:190px;border-radius:26px 26px 18px 18px;
  background:linear-gradient(180deg,#ff9cbb,#f0567f);box-shadow:0 8px 0 #c23c62,inset 0 6px 0 rgba(255,255,255,.35)}
.mlabel{position:absolute;left:18px;top:24px;color:#fff;font-size:19px;line-height:1.25;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.handle{position:absolute;right:24px;top:24px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#e4e4e4);box-shadow:0 7px 0 #b3b3b3,0 12px 14px rgba(0,0,0,.2)}
.handle span{position:absolute;left:50%;top:50%;width:70px;height:18px;margin:-9px 0 0 -35px;border-radius:9px;
  background:linear-gradient(#ffd34d,#f2a900);box-shadow:0 3px 0 #c98b00}
.handle.turn span{animation:turn 1s ease-in-out}
@keyframes turn{to{transform:rotate(360deg)}}
.handle:active{transform:translateY(5px);box-shadow:0 2px 0 #b3b3b3}
.handle:disabled{opacity:.55}
.tap-here{position:absolute;right:30px;top:-8px;background:#fff;color:#f0567f;border-radius:10px;padding:2px 8px;font-size:13px;animation:bob .8s ease-in-out infinite alternate;z-index:3}
.chute{position:absolute;left:50%;bottom:18px;width:84px;height:58px;margin-left:-42px;border-radius:14px 14px 8px 8px;
  background:#5a2236;box-shadow:inset 0 8px 12px rgba(0,0,0,.55)}
.capsule{position:absolute;left:50%;top:330px;width:110px;height:110px;margin-left:calc(-55px + var(--dx,0px));display:none;z-index:5;cursor:pointer}
.gacha-stage:not(.multi) #capsule1,.gacha-stage:not(.multi) #capsule2{display:none!important}
.gacha-stage.multi .capsule.ready{transform:translateY(-160px) scale(1.15)}
.pay-row{flex-wrap:wrap}.pay-row .btn{flex:1;min-width:150px;font-size:17px}
.rv3{display:flex;gap:18px;z-index:1;align-items:flex-start}
.rv3-item{display:flex;flex-direction:column;align-items:center;width:170px;animation:starpop .6s ease both}
.reveal .rv3 .stk{width:160px}
.rv3-name{font-size:18px;margin-top:8px}
.capsule.drop{display:block;animation:drop 1.1s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes drop{0%{transform:translateY(-20px) scale(.35);opacity:0}25%{opacity:1;transform:translateY(25px) scale(.45)}45%{transform:translateY(5px) scale(.5)}60%{transform:translateY(25px) scale(.5)}100%{transform:translateY(-160px) scale(1.5)}}
.capsule.ready{display:block;transform:translateY(-160px) scale(1.5)}
.capsule .ctop,.capsule .cbot{position:absolute;left:0;width:110px;height:55px;transition:transform .45s ease,opacity .45s}
.capsule .ctop{top:0;border-radius:55px 55px 0 0;background:var(--cc);box-shadow:inset 0 8px 0 rgba(255,255,255,.45)}
.capsule .cbot{bottom:0;border-radius:0 0 55px 55px;background:rgba(255,255,255,.95);border-top:4px solid rgba(0,0,0,.08)}
.capsule.ready .ctop{animation:wobble .7s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-7deg) translateY(-3px)}}
.capsule.open .ctop{animation:none;transform:translate(-30px,-80px) rotate(-40deg);opacity:0}
.capsule.open .cbot{transform:translate(30px,80px) rotate(30deg);opacity:0}
.flash{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:flash .6s ease forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.reveal{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6}
.reveal.show{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;top:50%;left:50%;width:460px;height:460px;margin:-260px 0 0 -230px;border-radius:50%;

let actx = null;
function audio(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type="sine", vol=0.2, slideTo=null){
  if(!save.settings.sfx) return;
  const a = audio(); if(!a) return;
  const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+0.05);
}

/* =========================================================
   文字の処理
   ========================================================= */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RUBY_RE = /\{([^|}]+)\|([^}]+)\}/g;
const ruby  = s => esc(s).replace(RUBY_RE, "<ruby>$1<rt>$2</rt></ruby>");
const plain = s => s.replace(RUBY_RE, "$1");
const spoken = s => s.replace(RUBY_RE, "$2").replace(/（　）/g, "、なに、");

// 漢数字（千五百四十三）を数字（1543）に直す
function kanjiToNum(s){
  if(!/^[〇一二三四五六七八九十百千]+$/.test(s)) return s;
  const d = {"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  let total=0, cur=0;
  for(const c of s){
    if(c in d) cur = d[c];
    else { const u = {"十":10,"百":100,"千":1000}[c]; total += (cur||1)*u; cur=0; }
  }
  return String(total+cur);
}
// 答えをくらべやすい形にそろえる（カタカナ→ひらがな、記号やスペースを消す など）
function norm(s){
  if(!s) return "";
  s = String(s).normalize("NFKC").toLowerCase();
  s = s.replace(/[\s・･=＝、。,.!?！？「」『』()\-]/g, "");
  s = s.replace(/ヶ/g, "が").replace(/です$/, "").replace(/(\d)年$/, "$1");
  s = s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  return kanjiToNum(s);
}
function isCorrect(q, input){
  const ok = [q.a, q.y, ...(q.alt||[])].filter(Boolean).map(norm);
  return ok.includes(norm(input));
}
// 答え方のヒント（何文字か など）
function answerKind(a){
  if(/^\d+$/.test(a)) return {label:"数字で答えよう（例：1543）", len:a.length};
  if(/^[゠-ヿ・]+$/.test(a)) return {label:"カタカナで答えよう（ひらがなでもOK）", len:a.replace(/・/g,"").length};
  return {label:`漢字 ${[...a.replace(/・/g,"")].length} 文字（ひらがなでもOK）`, len:[...a.replace(/・/g,"")].length};
}
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

}

  if(si === 0) return true;                                      // 各章の最初はいつでもOK
  if(si === 5) return [0,1,2,3,4].every(i=>starsOf(ch.id,i)>0);  // まとめテストは全部クリアで

function tapNode(chId, si){
  const ch = CHAPTERS.find(c=>c.id===chId);
  if(!isUnlocked(ch, si)){
    teacherMood(null,"shake");
    document.getElementById("greet").textContent = si===5 ? "5つのステージを全部クリアすると挑戦できるよ！" : "前のステージをクリアするとあそべるよ！";
    return;
  }
  const n = si===5 ? 12 : Math.min(8, ch.stages[si].qs.length);
  openModeSelect((si===5?"👑 まとめテスト":ch.stages[si].name), `第${ch.id}回 ${ch.title} ・ ${n}問 ・ ハート3つ`, mode=>startStage(ch.id, si, mode));
}
function tapReview(){
  const n = Math.min(10, weakList().length);
  if(!n) return;
  openModeSelect("📒 にがて復習", `まだおぼえていない問題から ${n}問 ・ ハート3つ`, mode=>startReview(mode));
}

// 進み具合を1つの文字列（コード）にする／もどす
const SAVE_CODE_HEAD = "RQ1:";
const saveToCode = () => SAVE_CODE_HEAD + btoa(unescape(encodeURIComponent(JSON.stringify(save))));
function codeToSave(code){
  const c = String(code).replace(/\s+/g, "");
  if(!c.startsWith(SAVE_CODE_HEAD)) return null;
  try{
    const obj = JSON.parse(decodeURIComponent(escape(atob(c.slice(SAVE_CODE_HEAD.length)))));
    return obj && typeof obj==="object" && obj.stars ? obj : null;
  }catch(e){ return null; }
}
async function exportSave(){
  const code = saveToCode();
  let copied = false;
  try{ await navigator.clipboard.writeText(code); copied = true; }catch(e){}
  showModal(`<h2>📤 進み具合をコピー</h2>
    <div class="bubble" style="text-align:left;margin-bottom:10px">${copied
      ? "コピーできたよ！ うつしたい ページで ⚙️ →「📥 進み具合をよみこむ」を おして、はりつけてね"
      : "下の文字を ぜんぶ えらんで コピーしてね。うつしたい ページで ⚙️ →「📥 進み具合をよみこむ」に はりつけてね"}</div>

  SFX.ticket();
}

   クイズ

let Q = null;  // いま遊んでいるステージの情報

function startSession(opt){
  closeModal();
  Q = {...opt, boss: opt.si===5,
    queue: opt.list.map(q=>({q, retry:false})),
    total: opt.list.length, cleared: 0, hearts: 3, combo: 0, firstTry: 0, xp: 0,
    missed: [], learned: [], current: null, locked: false};
  show("quiz");
  nextQuestion();
}
function startStage(chId, si, mode){
  const ch = CHAPTERS.find(c=>c.id===chId);
  const pool = stagePool(ch, si);
  const n = si===5 ? 12 : Math.min(8, pool.length);
  startSession({kind:"stage", ch, si, mode, title: si===5 ? "まとめテスト" : ch.stages[si].name, list: pickQuestions(pool, n)});
}
function startReview(mode){
  const weak = weakList();
  if(!weak.length){ goHome(); return; }
  startSession({kind:"review", mode, title:"にがて復習", list: pickQuestions(weak, Math.min(10, weak.length))});
}
function restartSession(){ Q.kind==="review" ? startReview(Q.mode) : startStage(Q.ch.id, Q.si, Q.mode); }

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function heartsHTML(){ return [0,1,2].map(i=>`<span class="${i<Q.hearts?"":"lost"}">❤️</span>`).join(""); }

function nextQuestion(){
  hideFeedback();
  stopListening();
  Q.current = Q.queue.shift();
  Q.locked = false;
  const {q, retry} = Q.current;
  const mode = q.o4 ? "choice" : Q.mode;
  const m = masteryOf(q);
  const el = document.getElementById("quiz");
  el.innerHTML = `
    <div class="quiz-top">
      <button class="quit" onclick="quitStage()">✕</button>
      <div class="bar"><div style="width:${Q.cleared/Q.total*100}%"></div></div>
      <div class="hearts">${heartsHTML()}</div>
    </div>
    <div class="combo" id="combo">${Q.combo>=3?`🔥 ${Q.combo}れんぞく！`:""}</div>
    <div class="teacher-row">
      ${teacherBox("sm")}
      <div class="bubble">
        <div class="q-tag">${retry?"🔁 もう一回！":""}${q.o4 && Q.mode!=="choice"?" この問題は4択だよ":""}${!retry && m>=MASTER?" ✅ おぼえた問題":""}</div>
        <div class="q-text">${ruby(q.q)}</div>
        <button class="read-btn" onclick="speak(spoken(Q.current.q.q), true)">🔈 読んで</button>
      </div>
    </div>
    <div id="ans"></div>`;
  const ans = document.getElementById("ans");
  if(mode==="choice") renderChoices(ans, q);
  else if(mode==="type") renderType(ans, q);
  else if(mode==="voice") renderVoice(ans, q);
  else renderHand(ans, q);
  if(save.settings.autoRead) speak(spoken(q.q));
}

/* --- 4択 --- */
function renderChoices(ans, q){
  const opts = shuffle([q.a, ...q.d.slice(0,3)]);
  ans.innerHTML = `<div class="choices">${opts.map(o=>`<button class="choice" data-silent="1" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  ans.querySelectorAll(".choice").forEach(b=>b.addEventListener("click", ()=>{
    if(Q.locked) return;
    const ok = b.dataset.v === q.a;
    b.classList.add(ok?"ok":"ng");
    if(!ok) ans.querySelectorAll(".choice").forEach(x=>{ if(x.dataset.v===q.a) x.classList.add("ok"); });
    judge(ok);
  }));
}

/* --- 音声 --- */
let recog = null;
function renderVoice(ans, q){
  ans.innerHTML = `${hintArea(q)}
    <button class="mic" id="mic" data-silent="1" onclick="toggleListen()">🎤</button>
    <div class="small-note" id="micNote">マイクをおして、答えを言ってね</div>
    <div class="heard" id="heard"></div>
    <div class="row" id="voiceConfirm" style="display:none">
      <button class="btn blue" onclick="toggleListen()">🎤 もう一回話す</button>
      <button class="btn" onclick="submitHeard()">これでこたえる</button>
    </div>
    ${helperRow()}`;
}
let heardList = [];
function toggleListen(){
  if(Q.locked) return;
  if(recog){ stopListening(); return; }
  SFX.pop();
  if(window.speechSynthesis) speechSynthesis.cancel();
  heardList = [];
  document.getElementById("voiceConfirm").style.display = "none";
  document.getElementById("heard").textContent = "";
  try{
    recog = new SR();
    recog.lang = "ja-JP"; recog.interimResults = true; recog.maxAlternatives = 5; recog.continuous = false;
  }catch(e){ document.getElementById("micNote").textContent = "音声入力が使えないみたい…"; return; }
  document.getElementById("mic").classList.add("listening");
  document.getElementById("micNote").textContent = "きいてるよ…";
  recog.onresult = e=>{
    const res = e.results[e.results.length-1];
    document.getElementById("heard").textContent = res[0].transcript;
    if(res.isFinal) heardList = Array.from(res).map(r=>r.transcript);
  };
  recog.onerror = e=>{
    const msg = (e.error==="not-allowed"||e.error==="service-not-allowed")
      ? "マイクが使えないよ。ブラウザでマイクを許可してね"
      : e.error==="no-speech" ? "聞こえなかったよ。もう一回おしてね" : "うまく聞きとれなかったよ";
    const n = document.getElementById("micNote"); if(n) n.textContent = msg;
  };
  recog.onend = ()=>{
    recog = null;
    const mic = document.getElementById("mic"); if(mic) mic.classList.remove("listening");
    if(!heardList.length || Q.locked) return;
    const hit = heardList.find(t=>isCorrect(Q.current.q, t));
    if(hit){ judge(true, hit); return; }
    document.getElementById("micNote").textContent = "こう聞こえたよ。これでいい？";
    document.getElementById("heard").textContent = `「${heardList[0]}」`;
    document.getElementById("voiceConfirm").style.display = "flex";
  };
  recog.start();
}
function stopListening(){ if(recog){ try{ recog.stop(); }catch(e){} } }
function submitHeard(){ if(!Q.locked && heardList.length) judge(false, heardList[0]); }

/* --- 手書き --- */
let pad = null;
function renderHand(ans, q){
  ans.innerHTML = `<div class="hint-line">${answerKind(q.a).label}</div>
    <div class="canvas-wrap"><canvas class="pad" id="pad"></canvas></div>
    <div class="row">
      <button class="btn gray" onclick="padUndo()">↩️ 1画もどす</button>
      <button class="btn gray" onclick="padClear()">🧽 ぜんぶ消す</button>
    </div>
    <div class="row"><button class="btn wide" id="handGo" onclick="submitHand()">こたえる</button></div>
    <div class="small-note" id="handNote"></div>
    <div class="row">
      <button class="btn gray" onclick="showHintHand()">💡 ヒント</button>
      <button class="btn gray" onclick="giveUp()">🤔 わからない</button>
    </div>`;
  setupPad(document.getElementById("pad"), answerKind(q.a).len);
}
function setupPad(cv, boxes){
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  pad = {cv, ctx, w:rect.width, h:rect.height, boxes:Math.max(1,Math.min(boxes,10)), strokes:[], cur:null, hint:""};
  const pos = e=>{ const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.onpointerdown = e=>{ if(Q.locked) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); pad.cur=[[x],[y],[Date.now()]]; drawPad(); };
  cv.onpointermove = e=>{ if(!pad.cur) return; e.preventDefault(); const [x,y]=pos(e); pad.cur[0].push(x); pad.cur[1].push(y); pad.cur[2].push(Date.now()); drawPad(); };
  const end = ()=>{ if(pad.cur){ if(pad.cur[0].length===1){ pad.cur[0].push(pad.cur[0][0]+1); pad.cur[1].push(pad.cur[1][0]+1); pad.cur[2].push(Date.now()); } pad.strokes.push(pad.cur); pad.cur=null; drawPad(); } };
  cv.onpointerup = end; cv.onpointercancel = end;
  drawPad();
}
function drawPad(){
  const {ctx,w,h,boxes} = pad;
  ctx.clearRect(0,0,w,h);
  // 書く場所の目安の四角
  const size = Math.min(w/boxes - 8, h - 30);
  const startX = (w - (size+8)*boxes + 8)/2, y0 = (h-size)/2;
  ctx.setLineDash([6,6]); ctx.strokeStyle="#d5dbc0"; ctx.lineWidth=2;
  ctx.font = `${size*.8}px "M PLUS Rounded 1c", sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=0;i<boxes;i++){
    const x = startX + i*(size+8);
    ctx.strokeRect(x, y0, size, size);
    if(i===0 && pad.hint){ ctx.fillStyle="rgba(92,191,42,.18)"; ctx.fillText(pad.hint, x+size/2, y0+size/2+2); }
  }
  ctx.setLineDash([]);
  ctx.strokeStyle="#333"; ctx.lineWidth=7; ctx.lineCap="round"; ctx.lineJoin="round";
  for(const s of [...pad.strokes, ...(pad.cur?[pad.cur]:[])]){
    ctx.beginPath(); ctx.moveTo(s[0][0], s[1][0]);
    for(let i=1;i<s[0].length;i++) ctx.lineTo(s[0][i], s[1][i]);
    ctx.stroke();
  }
}
function padUndo(){ if(pad && !Q.locked){ pad.strokes.pop(); drawPad(); } }
function padClear(){ if(pad && !Q.locked){ pad.strokes=[]; drawPad(); } }
function showHintHand(){ pad.hint = [...Q.current.q.a.replace(/・/g,"")][0]; drawPad(); teacherMood("happy"); speak("うすく出したから、なぞってみてね"); }

// Googleの手書き文字認識に「線の座標」だけを送って、読み取り候補をもらう
async function recognizeInk(strokes, w, h){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch("https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
      method:"POST", headers:{"Content-Type":"application/json"}, signal:ctrl.signal,
      body: JSON.stringify({options:"enable_pre_space", requests:[{
        writing_guide:{writing_area_width:Math.round(w), writing_area_height:Math.round(h)},
        ink: strokes.map(s=>[s[0].map(Math.round), s[1].map(Math.round), s[2]]),
        language:"ja", max_num_results:10
      }]})
    });
    const data = await res.json();
    if(data[0] !== "SUCCESS") throw new Error("NG");
    return data[1][0][1] || [];
  } finally { clearTimeout(timer); }
}
async function submitHand(){
  if(Q.locked) return;
  if(!pad.strokes.length){ teacherMood(null,"shake"); return; }
  const go = document.getElementById("handGo"), note = document.getElementById("handNote");
  go.disabled = true; note.textContent = "よみとり中…";
  try{
    const cands = await recognizeInk(pad.strokes, pad.w, pad.h);
    note.textContent = "";
    const hit = cands.find(c=>isCorrect(Q.current.q, c));
    judge(!!hit, hit || cands[0] || "", {hand:true});
  }catch(e){
    selfGrade();   // 読み取りができなかったときは、自分で丸つけ
  }
}
function selfGrade(){
  const q = Q.current.q;
  Q.locked = true;
  showFeedback("bad", `<div class="fb-title" style="color:#555">📝 自分で丸つけしてね</div>
    <div class="fb-ans">こたえ：<b>${esc(q.a)}</b>${q.y && q.y!==q.a?`（${esc(q.y)}）`:""}</div>
    <div class="fb-exp">字のよみとりができなかったよ（インターネットにつながっているか確認してね）。書いた字は合ってた？</div>
    <div class="row"><button class="btn" onclick="selfAnswer(true)">⭕ あってた</button><button class="btn red" onclick="selfAnswer(false)">❌ ちがった</button></div>`);
}
function selfAnswer(ok){ Q.locked=false; hideFeedback(); judge(ok, ""); }

/* --- 正解・不正解の判定 --- */
const meterHTML = m => `<div class="m-meter">おぼえた度 <b>${"●".repeat(m)}${"○".repeat(MASTER-m)}</b>${m<MASTER?`（あと${MASTER-m}回連続で正解すると「おぼえた！」）`:""}</div>`;
function judge(ok, userText="", opt={}){
  if(Q.locked) return;
  Q.locked = true;
  stopListening();
  const {q, retry} = Q.current;
  // おぼえた度を記録（「字はあってた！」で元にもどせるように、前の値もとっておく）
  Q.prev = {m: masteryOf(q), wrong: !!save.wrong[q.id]};
  let justLearned = false;
  if(ok){
    const m = Math.min(MASTER, Q.prev.m + 1);
    save.mastery[q.id] = m;
    justLearned = m===MASTER && Q.prev.m<MASTER;
    if(justLearned){ Q.learned.push(q); Q.newManga = addMangaPoint(); }
  }else{
    save.mastery[q.id] = 0;
    save.wrong[q.id] = true;
  }
  persist();
  const ansLine = `<div class="fb-ans">こたえ：<b>${esc(q.a)}</b>${q.y && q.y!==q.a && !/^\d+$/.test(q.a)?`（${esc(q.y)}）`:""}</div>`;
  if(ok){
    Q.cleared++; Q.combo++;
    if(!retry) Q.firstTry++;
    const gain = 10 + (Q.combo>=3 ? 5 : 0);
    Q.xp += gain;
    SFX.correct();
    if(justLearned) setTimeout(()=>SFX.star(), 280);
    else if(Q.combo>=3 && Q.combo%3===0) setTimeout(()=>SFX.combo(), 300);
    xpPop("+"+gain);
    teacherMood("happy","jump");
    const line = justLearned ? "おぼえたね！すごい！" : Q.combo>=3 ? `${Q.combo}もん連続！すごすぎる！` : pick(LINES.correct);
    speak(line);
    showFeedback("good", `<div class="fb-title">⭕ ${line}</div>
      ${justLearned?`<div class="mastered-badge">🎉「${esc(q.a)}」をおぼえた！${Q.newManga?"<br>📚 新しいマンガが読めるよ！":""}</div>`:meterHTML(save.mastery[q.id])}
      ${userText && opt.hand ? `<div class="fb-exp">よみとった字：「${esc(userText)}」</div>`:""}
      <div class="fb-exp">${esc(q.e||"")}</div>
      <button class="btn wide" onclick="afterAnswer()">つぎへ</button>`);
  }else{
    Q.hearts--; Q.combo = 0;
    Q.queue.push({q, retry:true});      // まちがえた問題はあとでもう一回
    if(!Q.missed.includes(q)) Q.missed.push(q);
    SFX.wrong();
    teacherMood("sad","shake");
    const line = pick(LINES.wrong);
    speak(`${line}。こたえは、${q.y && !/^\d+$/.test(q.a) ? q.y : q.a}、だよ`);
    const heard = userText ? `<div class="fb-exp">${opt.hand?"よみとった字":"あなたの答え"}：「${esc(userText)}」</div>` : "";
    showFeedback("bad", `<div class="fb-title">❌ ${line}</div>${ansLine}${heard}
      <div class="fb-exp">${esc(q.e||"")}</div>
      ${opt.hand ? `<div class="row"><button class="btn gray" onclick="overrideHand()">✍️ 字はあってた！</button><button class="btn red" onclick="afterAnswer()">つぎへ</button></div>`
                 : `<button class="btn red wide" onclick="afterAnswer()">つぎへ</button>`}`);
  }
  const hb = document.querySelector(".hearts"); if(hb) hb.innerHTML = heartsHTML();
  const bar = document.querySelector(".bar>div"); if(bar) bar.style.width = (Q.cleared/Q.total*100)+"%";
  const cb = document.getElementById("combo"); if(cb) cb.textContent = Q.combo>=3 ? `🔥 ${Q.combo}れんぞく！` : "";
}
// 手書きの読み取りまちがいのときに「正解」にもどす
function overrideHand(){
  const {q} = Q.current;
  Q.queue.pop(); Q.hearts++; Q.cleared++;
  const i = Q.missed.indexOf(q); if(i>=0) Q.missed.splice(i,1);
  if(!Q.current.retry) Q.firstTry++;
  const m = Math.min(MASTER, Q.prev.m + 1);
  save.mastery[q.id] = m;
  if(!Q.prev.wrong) delete save.wrong[q.id];
  if(m===MASTER && Q.prev.m<MASTER){ Q.learned.push(q); addMangaPoint(); }
  persist();
  Q.xp += 10; SFX.correct(); xpPop("+10"); teacherMood("happy","jump"); speak("ごめんね、ちゃんと書けてたね！");
  afterAnswer();
}
function afterAnswer(){
  if(Q.hearts <= 0) return showFail();
  if(!Q.queue.length) return showClear();
  nextQuestion();
}
let fbRaf = 0;
function showFeedback(kind, html){
  const f = document.getElementById("feedback");
  f.className = "feedback " + kind;
  document.getElementById("fbInner").innerHTML = html;
  cancelAnimationFrame(fbRaf);
  fbRaf = requestAnimationFrame(()=>f.classList.add("show"));
}
function hideFeedback(){ cancelAnimationFrame(fbRaf); document.getElementById("feedback").classList.remove("show"); }
function xpPop(text){
  const s = document.createElement("div");
  s.className = "xp-pop"; s.textContent = text + " 💎";
  s.style.left = (window.innerWidth/2 - 40) + "px"; s.style.top = (window.innerHeight*0.38) + "px";
  document.body.appendChild(s); setTimeout(()=>s.remove(), 1000);
}
function quitStage(){
  if(!confirm("とちゅうでやめる？（おぼえた度は記録されるけど、ゲージや★はもらえないよ）")) return;
  stopListening(); hideFeedback(); if(window.speechSynthesis) speechSynthesis.cancel();
  goHome();
}

/* =========================================================
   結果画面
   ========================================================= */
function updateStreak(){
  const d = new Date(); const today = d.toDateString();
  const y = new Date(d - 86400000).toDateString();
  if(save.streak.last === today) return;
  save.streak.count = save.streak.last === y ? save.streak.count + 1 : 1;
  save.streak.last = today;
}
function missedHTML(){
  if(!Q.missed.length) return "";
  return `<div class="missed"><h3>📒 まちがえた言葉をおさらい</h3><ul>${
    Q.missed.map(q=>`<li><b>${esc(q.a)}</b>${q.y&&q.y!==q.a&&!/^\d+$/.test(q.a)?`（${esc(q.y)}）`:""}… ${esc(plain(q.q))}</li>`).join("")
  }</ul><div class="small-note">「にがて復習」で、何回でも練習できるよ</div></div>`;
}
function showClear(){
  hideFeedback();
  let got = 0;
  if(Q.kind==="stage"){
    got = MODES[Q.mode].stars;
    const k = key(Q.ch.id, Q.si);
    save.stars[k] = Math.max(save.stars[k]||0, got);
  }
  save.xp += Q.xp;
  updateStreak();
  // ガチャゲージ
  const gBefore = save.gauge;
  save.gauge++;
  let ticket = false;
  if(save.gauge >= 3){ save.gauge -= 3; save.tickets++; ticket = true; }
  persist();

  const acc = Math.round(Q.firstTry / Q.total * 100);
  const el = document.getElementById("result");
  el.className = "screen result";
  el.innerHTML = `
    <div style="display:flex;justify-content:center">${teacherBox()}</div>
    <h1>${Q.kind==="review"?"📒 にがて復習":Q.boss?"👑 まとめテスト":"ステージ"}クリア！</h1>
    <div style="font-size:18px">${esc(Q.title)}（${MODES[Q.mode].icon} ${MODES[Q.mode].name}）</div>

const GACHA_COST = 200, GACHA3_COST = 500;   // ダイヤでまわすときの値段（1回・3連）
const canPay = k => k==="ticket" ? save.tickets>0 : save.xp >= (k==="three" ? GACHA3_COST : GACHA_COST);
const canAnyGacha = () => ["ticket","one","three"].some(canPay);

// レア度を決めてから、まだ持っていないシールが出やすくなるように選ぶ
function drawSticker(){
  const total = Object.values(RARITY).reduce((a,r)=>a+r.weight,0);
  let x = Math.random()*total, rar = "N";
  for(const [k,r] of Object.entries(RARITY)){ if((x -= r.weight) < 0){ rar = k; break; } }
  const cands = STICKERS.filter(s=>s.r===rar);
  const w = cands.map(s=>save.stickers[s.id] ? 1 : 3);
  let y = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<cands.length;i++){ if((y -= w[i]) < 0) return cands[i]; }
  return cands[0];
}
const RANK = {N:0, R:1, SR:2};
function turnHandle(kind){
  if(G.busy || !canPay(kind)) return;
  G.busy = true;
  const n = kind==="three" ? 3 : 1;
  // 先に支払いとシールを決めて保存（とちゅうで閉じてもなくならないように）
  if(kind==="ticket") save.tickets--;
  else save.xp -= (n===3 ? GACHA3_COST : GACHA_COST);
  G.sts = []; G.news = [];
  for(let i=0;i<n;i++){
    const st = drawSticker();
    G.news.push(!save.stickers[st.id]);
    save.stickers[st.id] = (save.stickers[st.id]||0) + 1;
    G.sts.push(st);
  }
  persist();
  document.getElementById("gLeft").textContent = `🎟️ ${save.tickets} ・ 💎 ${save.xp}`;
  document.getElementById("payRow").style.visibility = "hidden";
  document.querySelector(".tap-here")?.remove();
  document.getElementById("handle").classList.add("turn");
  document.getElementById("machine").classList.add("shake");
  document.getElementById("gstage").classList.toggle("multi", n===3);
  document.getElementById("gnote").textContent = n===3 ? "3連ガチャ！ガラガラ…" : "ガラガラ…なにが出るかな？";
  SFX.ratchet(); speak(n===3 ? "3れんガチャだ！なにが出るかな？" : "なにが出るかな？");
  setTimeout(()=>{
    G.sts.forEach((st,i)=>{
      const cap = document.getElementById("capsule"+i);
      cap.style.setProperty("--cc", pick(CAP_COLORS[st.r]));
      if(st.r==="SR") cap.querySelector(".ctop").style.background = "conic-gradient(#ff5a5a,#ffc83d,#5cbf2a,#3fa9f5,#b36bff,#ff5a5a)";
      setTimeout(()=>{ cap.classList.add("drop"); SFX.thud(); }, i*350);
    });
    setTimeout(()=>{
      G.sts.forEach((_,i)=>{ const cap = document.getElementById("capsule"+i); cap.classList.remove("drop"); cap.classList.add("ready"); });
      document.getElementById("machine").classList.remove("shake");
      document.getElementById("machine").classList.add("dim");
      const rare = G.sts.some(st=>st.r!=="N");
      document.getElementById("gnote").textContent = rare ? "✨ キラキラのカプセルがある！タップしてあけよう！" : "カプセルをタップしてあけよう！";
      G.ready = true;
    }, 1100 + (n-1)*350);
  }, 1000);
}
function openCapsule(){
  if(!G.ready) return;
  G.ready = false;
  const sts = G.sts, best = sts.reduce((a,b)=>RANK[b.r]>RANK[a.r]?b:a);
  sts.forEach((_,i)=>document.getElementById("capsule"+i).classList.add("open"));
  SFX.pop();
  setTimeout(()=>{
    const fl = document.createElement("div"); fl.className = "flash"; document.body.appendChild(fl); setTimeout(()=>fl.remove(), 700);
    sts.forEach((_,i)=>document.getElementById("capsule"+i).style.display = "none");
    const rv = document.getElementById("reveal");
    if(sts.length===1){
      const st = sts[0];
      rv.innerHTML = `<div class="rays ${st.r}"></div>
        ${stickerHTML(st)}

        <div class="rv-rar">${RARITY[st.r].stars} ${RARITY[st.r].name}</div>
        ${G.news[0]?`<div class="rv-new">NEW!</div>`:`<div class="small-note" style="z-index:1">${save.stickers[st.id]}まいめ</div>`}`;
    }else{
      rv.innerHTML = `<div class="rays ${best.r}"></div><div class="rv3">${sts.map((st,i)=>`
        <div class="rv3-item" style="animation-delay:${i*.18}s">
          ${stickerHTML(st)}

          ${G.news[i]?`<div class="rv-new" style="font-size:13px">NEW!</div>`:`<div class="small-note" style="margin:0">${save.stickers[st.id]}まいめ</div>`}
        </div>`).join("")}</div>`;
    }
    rv.classList.add("show");
    SFX["reveal"+best.r]();
    if(best.r!=="N") confetti();
    const newN = G.news.filter(Boolean).length;
    speak(sts.length===1 ? `${best.name}のシールだ！${newN?"はじめてだね！":""}` : `${sts.map(s=>s.name).join("、")}のシールだ！${newN?`はじめてのシールが${newN}まい！`:""}`);

      <button class="btn blue" onclick="openBook()">📖 シール帳</button>

  }, 450);
}

// みるく先生（または仲間）を1人かく。x=左はし, w=はば, mood=happy/sad/wow, flip=左右反転, ground=足の位置
function M(x, costume, opt={}){
  const w = opt.w || 150, h = w*258/232;
  const y = (opt.ground || 226) - h*0.96;
  const base = costume ? STK(costume) : {};
  const st = {...base, back:(base.back||"")+(opt.back||""), top:(base.top||"")+(opt.top||"")};
  if(opt.mood==="happy") st.eyes = "happy";
  if(opt.mood==="sad" || opt.mood==="wow"){
    st.eyeColor = "transparent";
    st.top = (opt.mood==="sad"
      ? `<g fill="none" stroke="#2a2a2a" stroke-width="3.2" stroke-linecap="round"><path d="M71 102 q7 6 14 2"/><path d="M103 104 q7 4 14 -2"/></g>`
      : `<g fill="#fff" stroke="#2a2a2a" stroke-width="2.6"><circle cx="78" cy="103" r="7"/><circle cx="110" cy="104" r="7"/></g><g fill="#2a2a2a"><circle cx="78" cy="103" r="2.6"/><circle cx="110" cy="104" r="2.6"/></g>`) + st.top;
  }
  if(opt.fluffy) st.back = `<ellipse cx="98" cy="96" rx="112" ry="100" fill="url(#fur)" stroke="#d9cc9a" stroke-width="3" stroke-dasharray="10 6"/>` + st.back;
  const svg = stickerSVG(st).replace("<svg ", `<svg x="${x}" y="${y}" width="${w}" height="${h}" `);
  return opt.flip ? `<g transform="translate(${2*x+w} 0) scale(-1 1)">${svg}</g>` : svg;
}

// ---- ゲージ ----
const mangaOpen = () => Math.min(save.manga.open, MANGA.length);
// 「おぼえた！」が1つふえたら呼ぶ。新しい話が読めるようになったら true
function addMangaPoint(){
  const g = save.manga;
  if(g.open >= MANGA.length) return false;
  g.gauge++;
  if(g.gauge >= MANGA_STEP){ g.gauge = 0; g.open++; return true; }
  return false;
}
function mangaGaugeHTML(){
  const full = mangaOpen() >= MANGA.length;
  return `<div class="gauge mg">${[...Array(MANGA_STEP)].map((_,i)=>`<span class="${full||i<save.manga.gauge?"on":""}"></span>`).join("")}</div>`;
}
const unreadCount = () => MANGA.slice(0, mangaOpen()).filter((_,i)=>!save.manga.seen[i]).length;

// ---- 本棚 ----
function openShelf(){ show("shelf"); renderShelf(); }
function renderShelf(){
  const open = mangaOpen();
  const full = open >= MANGA.length;
  let html = `
    <div class="quiz-top"><button class="quit" onclick="goHome()">✕</button><div class="g-title">📚 本棚</div><div class="stat">${open} / ${MANGA.length}</div></div>
    <div class="teacher-row">
      ${teacherBox("sm")}
      <div class="bubble" style="font-size:17px">${full?"ぜんぶ読めるようになったね！何回でも読んでね":`「おぼえた！」を あと <b>${MANGA_STEP-save.manga.gauge}こ</b> ふやすと、つぎのマンガが読めるよ`}</div>
    </div>
    ${mangaGaugeHTML()}`;
  for(const ch of CHAPTERS){
    html += `<div class="rar-label">第${ch.id}回 ${ch.title}</div><div class="shelf">`;
    MANGA.forEach((m,i)=>{
      if(m.ch!==ch.id) return;
      const ok = i < open, seen = save.manga.seen[i];
      html += `<button class="mbook ${ok?"":"locked"}" style="--c:${ch.color}" ${ok?`onclick="openManga(${i})"`:`data-silent="1"`}>
        ${ok&&!seen?`<span class="stk-count">NEW</span>`:""}
        <span class="mb-no">第${i+1}話</span>
        <span class="mb-title">${ok?m.title:"？？？"}</span>
        <span class="mb-icon">${ok?"📖":"🔒"}</span>
      </button>`;
    });
    html += `</div>`;
  }
  html += `<div class="row" style="margin-top:20px"><button class="btn gray wide" onclick="goHome()">ホームへもどる</button></div>`;
  document.getElementById("shelf").innerHTML = html;
}

// ---- 読む画面 ----
let MV = null; // {i: 何話目, k: 何コマ目（4でおしまい）}
SFX.page = () => { tone(520,0,.08,"sine",.12,900); tone(900,.05,.08,"sine",.08,1300); };
function openManga(i){ MV = {i, k:0}; show("manga"); renderMangaFrame(); }
function mangaGo(d){
  if(!MV) return;
  const k = MV.k + d;
  if(k < 0 || k > 4) return;
  MV.k = k; SFX.page(); renderMangaFrame();
}
function panelHTML(p){
  return `<div class="panel">
    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${p.s}</svg>
    ${p.cap?`<div class="mcap">${ruby(p.cap)}</div>`:""}
    ${p.b.map(([x,y,w,t])=>`<div class="mbub" style="left:${x}%;top:${y+(p.cap?9:0)}%;width:${w}%">${ruby(t)}</div>`).join("")}
  </div>`;
}
function renderMangaFrame(){
  const m = MANGA[MV.i], ch = CHAPTERS.find(c=>c.id===m.ch);
  const el = document.getElementById("manga");
  let body;
  if(MV.k < 4){
    const p = m.p[MV.k];
    body = `<div class="m-stage" onclick="mangaTap(event)">
        ${panelHTML(p)}
        <div class="m-num">${MV.k+1}</div>
      </div>
      <div class="m-hint">◀ 左をタッチでもどる　｜　右をタッチで すすむ ▶</div>`;
    if(MV.k === 3 && !save.manga.seen[MV.i]){ save.manga.seen[MV.i] = true; persist(); }
    speak(p.b.map(b=>spoken(b[3])).join("。"));
  }else{
    body = `<div class="m-end">
        <div style="display:flex;justify-content:center">${teacherBox()}</div>
        <div class="m-end-title">おしまい</div>
        <div class="bubble" style="text-align:left"><div class="tname">💡 まめちしき</div>${ruby(m.note)}</div>
        <div class="row" style="margin-top:16px">
          <button class="btn blue" onclick="openManga(${MV.i})">🔁 もう一回</button>
          <button class="btn gold" onclick="openShelf()">📚 本棚へ</button>
        </div>
      </div>`;
    speak(spoken(m.note));
  }
  el.innerHTML = `
    <div class="quiz-top"><button class="quit" onclick="speechSynthesis.cancel();openShelf()">✕</button>
      <div class="g-title" style="color:${ch.color}">第${MV.i+1}話「${m.title}」</div><div style="width:40px"></div></div>
    ${body}
    <div class="m-nav">
      <button class="btn gray" onclick="mangaGo(-1)" ${MV.k===0?"disabled":""}>◀ もどる</button>
      <div class="m-dots">${[0,1,2,3].map(i=>`<span class="${i===MV.k?"on":i<MV.k?"done":""}"></span>`).join("")}</div>
      <button class="btn blue" onclick="mangaGo(1)" ${MV.k===4?"disabled":""}>${MV.k===3?"おしまい ▶":"すすむ ▶"}</button>
    </div>`;
}
function mangaTap(e){
  const r = e.currentTarget.getBoundingClientRect();
  mangaGo(e.clientX - r.left < r.width/2 ? -1 : 1);
}

// チャレンジャー（まだ持っていないキャラ）を島に呼ぶ
function refreshVisitors(){
  const v = isl().visitors.filter(id=>!save.stickers[id] && STICKERS.some(s=>s.id===id));
  const built = BUILDINGS.filter(b=>bLv(b.id));
  const want = Math.min(4, 1 + Math.floor(built.length/2));
  const near = new Set(built.flatMap(b=>b.who));
  while(v.length < want){
    const cands = STICKERS.filter(s=>!save.stickers[s.id] && !v.includes(s.id));
    if(!cands.length) break;
    const w = cands.map(s=>near.has(s.id) ? 5 : 1);
    let r = Math.random()*w.reduce((a,b)=>a+b,0), pickI = 0;
    for(let i=0;i<cands.length;i++){ if((r -= w[i]) < 0){ pickI = i; break; } }
    v.push(cands[pickI].id);
  }
  isl().visitors = v;
  persist();
}

function tapFriend(id, el){
  const st = STICKERS.find(s=>s.id===id);
  const b = document.getElementById("ibubble");
  b.innerHTML = `<b>${st.name}</b>：${esc(st.desc)}`;
  b.style.left = Math.min(60, parseFloat(el.style.left)) + "%";
  b.style.top = Math.max(2, parseFloat(el.style.top) - 22) + "%";
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
  SFX.pop(); speak(st.desc);
}
function tapBuilding(id){
  const b = BUILDINGS.find(x=>x.id===id), lv = bLv(id);
  const whoHTML = b.who.map(sid=>{ const st = STICKERS.find(s=>s.id===sid); const have = save.stickers[sid];
    return `<div class="who-cell">${stickerHTML(st, !have)}<div class="stk-name">${have?st.name:"？？？"}</div></div>`; }).join("");
  const cost = lv===0 ? b.cost : lvCost(b);
  const can = save.xp >= cost;
  const btn = lv>=2 ? `<div class="small-note">✨ さいだいレベル！</div>`
    : `<button class="btn ${can?"gold":"gray"} wide" ${can?"":"disabled"} onclick="buildIt('${id}')">${lv?"⬆️ レベル2にする":"🔨 建てる"}（💎${cost}）${can?"":`<br><small>あと💎${cost-save.xp}</small>`}</button>`;
  showModal(`<h2>${lv?"🏯":"🔨"} ${b.name}${lv?`（レベル${lv}）`:""}</h2>
    <div class="bld-big">${lv?buildingSVG(id,lv):buildingSVG(id,1).replace("<svg ",'<svg style="filter:grayscale(1);opacity:.45" ')}</div>
    <div class="bubble" style="text-align:left;margin:6px 0 10px">💡 ${b.info}</div>
    <div class="small-note" style="text-align:left;margin:0">この建物があると、来やすくなるキャラ：</div>
    <div class="who-row">${whoHTML}</div>
    ${btn}
    <div class="row"><button class="btn gray wide" onclick="closeModal()">とじる</button></div>`);
}
SFX.hammer = () => { [0,.22,.44].forEach(t=>{ tone(180,t,.08,"square",.12,90); tone(900,t,.05,"triangle",.08); }); };
function buildIt(id){
  const b = BUILDINGS.find(x=>x.id===id), lv = bLv(id);
  const cost = lv===0 ? b.cost : lvCost(b);
  if(lv>=2 || save.xp < cost) return;
  save.xp -= cost;
  isl().b[id] = lv + 1;
  persist();
  closeModal();
  renderIsland();
  const el = [...document.querySelectorAll(".ibld")][BUILDINGS.indexOf(b)];
  el.classList.add("building");
  SFX.hammer(); setTimeout(()=>SFX.hammer(), 700);
  speak(lv ? `${b.name}を、もっとりっぱにしよう！` : `${b.name}を建てるよ！トンカチ、トンカチ！`);
  setTimeout(()=>{
    el.classList.remove("building"); el.classList.add("done");
    SFX.clear(); confetti();
    const before = isl().visitors.length;
    refreshVisitors();
    const came = isl().visitors.length - before;
    setTimeout(()=>{
      renderIsland();
      showModal(`<div style="text-align:center"><h2>🎉 ${b.name}が${lv?"レベル2になった":"できた"}！</h2>
        <div class="bld-big">${buildingSVG(id, lv+1)}</div>
        <div class="bubble" style="text-align:left;margin:8px 0">💡 ${b.info}</div>
        <div class="isl-title" style="margin:6px 0">島のランク：「${islandTitle()}」</div>
        ${came>0?`<div class="mastered-badge">❗ 新しいチャレンジャーが ${came}人 やってきた！</div>`:""}
        <button class="btn blue wide" onclick="closeModal()">やったね！</button></div>`);
      speak(b.info);
    }, 600);
  }, 1500);
}

// ---- チャレンジ（勝負） ----
let CH = null; // {st, qs, i, timer, hintUsed}
function tapVisitor(id){
  const st = STICKERS.find(s=>s.id===id);
  const pool = cqPool();
  const can = save.xp >= CHALLENGE_COST && pool.length >= 3;
  const rule = st.r==="SR" ? "⏱️ 1問20秒の制限時間つき！" : st.r==="R" ? "ヒントなしで勝負！" : "💡 1問に1回、ヒントが使えるよ";
  showModal(`<div style="text-align:center">
    ${stickerHTML(st, false, "big-stk")}
    <h2>${st.name} があらわれた！</h2>
    <div class="rv-rar">${RARITY[st.r].stars} ${RARITY[st.r].name}</div>
    <div class="bubble" style="text-align:left;margin:10px 0">「わたしの問題に <b>3問とも正解</b> できたら、仲間になってあげる！」<br><small>${rule}</small></div>
    ${pool.length<3?`<div class="small-note" style="color:#e33">まずはステージを1つクリアしてね。クリアした回の問題が出るよ</div>`:""}
    <button class="btn red wide ${can?"shine":""}" ${can?"":"disabled"} onclick="startChallenge('${id}')">⚔️ 勝負する（💎${CHALLENGE_COST}）${save.xp<CHALLENGE_COST?`<br><small>あと💎${CHALLENGE_COST-save.xp}</small>`:""}</button>
    <div class="row"><button class="btn gray wide" onclick="closeModal()">またこんど</button></div></div>`);
  speak(`${st.name}があらわれた！3問とも正解できたら、仲間になってあげる！`);
}
function pickCQ(n){
  const seen = isl().cq;
  return cqPool().map(q=>({q, k:(seen[q.id]||0) + Math.random()*1.5})).sort((a,b)=>a.k-b.k).slice(0,n).map(x=>x.q);
}
function startChallenge(id){
  if(save.xp < CHALLENGE_COST || cqPool().length < 3) return;
  save.xp -= CHALLENGE_COST;
  const qs = pickCQ(3);
  qs.forEach(q=>{ isl().cq[q.id] = (isl().cq[q.id]||0) + 1; });
  persist();
  closeModal();
  CH = {st: STICKERS.find(s=>s.id===id), qs, i:0, timer:null};
  show("challenge");
  SFX.ratchet();
  renderCQ();
}
function renderCQ(){
  clearInterval(CH.timer);
  const {st, qs, i} = CH, q = qs[i];
  CH.locked = false; CH.hint = false;
  const ch = CHAPTERS.find(c=>c.id===q.ch);
  const opts = shuffle([q.a, ...q.d]);
  document.getElementById("challenge").innerHTML = `
    <div class="quiz-top"><button class="quit" onclick="quitChallenge()">✕</button>
      <div class="cq-dots">${qs.map((_,k)=>`<span class="${k<i?"ok":k===i?"now":""}">${k<i?"⭕":k+1}</span>`).join("")}</div>
      <div class="stat">${RARITY[st.r].stars}</div></div>
    <div class="teacher-row">
      <div class="cq-face">${stickerHTML(st)}</div>
      <div class="bubble"><div class="tname">${st.name}の チャレンジ問題（第${i+1}問）</div>
        <span class="cq-kind" style="background:${ch.color}">第${q.ch}回 ・ ${q.k}</span>
        <div class="cq-q">${esc(q.q)}</div></div>
    </div>
    ${st.r==="SR"?`<div class="cq-time"><div id="cqBar"></div></div>`:""}
    <div class="cq-choices">${opts.map(o=>`<button class="choice cq-choice" data-silent="1" data-v="${esc(o)}" onclick="answerCQ(this)">${esc(o)}</button>`).join("")}</div>
    ${st.r==="N"?`<div class="row"><button class="btn gray" id="cqHint" onclick="cqHint()">💡 ヒント（2つ消す）</button></div>`:""}
    <div id="cqFb"></div>`;
  speak(q.q);
  if(st.r==="SR"){
    const T = 20, t0 = Date.now();
    CH.timer = setInterval(()=>{
      const left = T - (Date.now()-t0)/1000;
      const bar = document.getElementById("cqBar"); if(bar) bar.style.width = Math.max(0,left/T*100)+"%";
      if(left <= 0){ clearInterval(CH.timer); answerCQ(null); }
    }, 100);
  }
}
function cqHint(){
  if(CH.locked || CH.hint) return;
  CH.hint = true;
  const q = CH.qs[CH.i];
  shuffle([...document.querySelectorAll(".cq-choice")].filter(b=>b.dataset.v!==q.a)).slice(0,2).forEach(b=>{ b.disabled = true; b.classList.add("gone"); });
  document.getElementById("cqHint").disabled = true;
  SFX.pop();
}
function answerCQ(btn){
  if(CH.locked) return;
  CH.locked = true;
  clearInterval(CH.timer);
  const q = CH.qs[CH.i];
  const ok = btn && btn.dataset.v === q.a;
  document.querySelectorAll(".cq-choice").forEach(b=>{ b.disabled = true; if(b.dataset.v===q.a) b.classList.add("ok"); });
  if(btn && !ok) btn.classList.add("ng");
  document.getElementById("cqHint")?.setAttribute("disabled","");
  if(ok){
    SFX.correct();
    const last = CH.i === CH.qs.length-1;
    document.getElementById("cqFb").innerHTML = `<div class="cq-fb good"><b>⭕ 正解！</b> ${esc(q.e)}
      <button class="btn wide" style="margin-top:10px" onclick="${last?"cqWin()":"CH.i++;renderCQ()"}">${last?"🎉 けっかを見る":"つぎの問題へ"}</button></div>`;
    speak("正解！");
  }else{
    SFX.wrong();
    document.getElementById("cqFb").innerHTML = `<div class="cq-fb bad"><b>❌ ${btn?"ざんねん！":"時間切れ！"}</b> こたえ：<b>${esc(q.a)}</b><br>${esc(q.e)}
      <button class="btn red wide" style="margin-top:10px" onclick="cqLose()">けっかを見る</button></div>`;
    speak(`${btn?"ざんねん":"時間切れ"}。こたえは、${q.a}、だよ`);
  }
  document.getElementById("cqFb").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function cqWin(){
  const st = CH.st;
  save.stickers[st.id] = (save.stickers[st.id]||0) + 1;
  isl().visitors = isl().visitors.filter(id=>id!==st.id);
  persist();
  refreshVisitors();
  document.getElementById("challenge").innerHTML = `
    <div class="cq-result">
      <div class="rays ${st.r}" style="position:absolute;top:180px"></div>
      <h1 style="position:relative">🎉 3問とも正解！</h1>
      <div style="position:relative;width:220px;margin:10px auto">${stickerHTML(st)}</div>
      <div class="rv-name" style="position:relative">${st.name} が なかまになった！</div>
      <div class="rv-new" style="position:relative;display:inline-block">シールゲット！</div>
      <div class="row" style="position:relative;margin-top:20px">
        <button class="btn blue" onclick="openBook()">📖 シール帳</button>
        <button class="btn gold" onclick="openIsland()">🏝️ 島へもどる</button>
      </div>
    </div>`;
  SFX["reveal"+st.r](); confetti();
  speak(`やったね！${st.name}が、なかまになった！`);
}
function cqLose(){
  const st = CH.st;
  const can = save.xp >= CHALLENGE_COST;
  document.getElementById("challenge").innerHTML = `
    <div class="cq-result">
      <h1>ざんねん…</h1>
      <div style="width:180px;margin:10px auto">${stickerHTML(st)}</div>
      <div class="bubble" style="text-align:left">${st.name}「また挑戦してね！ 島で待ってるよ」<br><small>まちがえた問題の説明を読んで、もう一回チャレンジしよう。問題は入れかわるよ</small></div>
      <div class="row" style="margin-top:16px">
        <button class="btn gray" onclick="openIsland()">🏝️ 島へもどる</button>
        <button class="btn red" ${can?"":"disabled"} onclick="startChallenge('${st.id}')">⚔️ もう一回（💎${CHALLENGE_COST}）</button>
      </div>
    </div>`;
  SFX.fail(); speak(`${st.name}、また挑戦してね！`);
}
function quitChallenge(){
  if(!confirm("勝負をやめる？（💎はもどらないよ）")) return;
  clearInterval(CH.timer);
  openIsland();
}

renderHome();
</script>
</body>
</html>
